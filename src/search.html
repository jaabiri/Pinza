<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Search Screenshots</title>
    <link rel="stylesheet" href="search.css" />
  </head>
  <body>
    <header>
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" /><path d="M10.5 10.5 14 14" /></svg>
      <input id="q" type="search" placeholder="Search text in screenshots, file names or dates (2026-10-09)" autofocus spellcheck="false" />
    </header>
    <p id="note"></p>
    <main id="grid"></main>
    <footer>Enter copies and hangs it on the line · Double click opens · Esc closes</footer>
    <script src="search.js"></script>
  </body>
</html>
