<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinza</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="edge"></div>
    <div id="line">
      <svg id="rope" aria-hidden="true">
        <defs>
          <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity="0" />
            <stop offset="0.08" stop-color="#fff" stop-opacity="1" />
            <stop offset="0.92" stop-color="#fff" stop-opacity="1" />
            <stop offset="1" stop-color="#fff" stop-opacity="0" />
          </linearGradient>
          <mask id="ends"><rect x="0" y="0" width="100%" height="100%" fill="url(#fade)" /></mask>
          <filter id="soft"><feGaussianBlur stdDeviation="1.2" /></filter>
        </defs>
        <g mask="url(#ends)">
          <path class="rope-shadow" filter="url(#soft)" />
          <path class="rope-core" />
          <path class="rope-shine" />
        </g>
      </svg>
      <div id="hint">Take a screenshot and it will hang here</div>
      <div id="pegs"></div>
      <div id="actions" role="menu" aria-label="Photo actions"></div>
      <div id="qr" role="dialog" aria-label="Send to phone">
        <div class="code"></div>
        <div class="words"><b>Scan with your phone</b><span></span></div>
      </div>
      <button id="tag" title="Next line (Tab)"></button>
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
