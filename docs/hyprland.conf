# Pinza on Hyprland / Omarchy. Paste into ~/.config/hypr/hyprland.conf
# (on Omarchy, ~/.config/hypr/autostart.conf and bindings.conf work too).

# Start with the session.
exec-once = pinza

# Wayland does not let apps grab global shortcuts, so the compositor does it
# and tells the running Pinza what to do.
bind = CTRL ALT, T, exec, pinza toggle
bind = CTRL ALT, F, exec, pinza search
# bind = CTRL ALT SHIFT, T, exec, pinza clear
# bind = CTRL ALT, L, exec, pinza next-line

# The search window is a normal window; float it if you prefer.
# windowrule = float, title:^(Search Screenshots)$

# Optional: real frosted glass behind the photos. Pinza is a layer surface
# named "pinza"; ignorezero keeps the transparent parts unblurred.
# (Rule syntax changes between Hyprland releases; adjust if reload complains.)
# layerrule = blur, pinza
# layerrule = ignorezero, pinza
